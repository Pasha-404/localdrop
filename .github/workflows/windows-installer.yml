name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Build and verify Windows release artifacts
        run: .\gradlew.bat buildWindowsInstaller --no-daemon

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localdrop-windows-release-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_DIRECTORY: dist/release
        run: |
          $assets = Get-ChildItem -Path $env:RELEASE_DIRECTORY -Recurse -File
          if ($assets.Count -ne 3) {
            throw "Expected exactly three release artifacts, found $($assets.Count)"
          }
          gh release view $env:TAG_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG_NAME $assets.FullName --title $env:TAG_NAME --generate-notes
          }
          else {
            gh release upload $env:TAG_NAME $assets.FullName --clobber
          }
