import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.awt.Graphics2D
import java.awt.RenderingHints
import java.awt.image.BufferedImage
import java.io.ByteArrayOutputStream
import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.jar.JarFile
import java.util.Locale
import java.util.Properties
import javax.imageio.ImageIO

plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.localdrop'

def requireGradleProperty = { String name ->
    String value = providers.gradleProperty(name).getOrNull()
    if (value == null || value.isBlank()) {
        throw new GradleException("Required Gradle property '${name}' is missing.")
    }
    value.trim()
}

def installerVersion = requireGradleProperty('version')
if (!(installerVersion ==~ /\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?/)) {
    throw new GradleException("Version '${installerVersion}' is not valid SemVer.")
}
def installerAppName = requireGradleProperty('appName')
def technicalName = requireGradleProperty('technicalName')
def mainExecutable = "${technicalName}.exe"
def publisher = requireGradleProperty('publisher')
def repositoryUrl = requireGradleProperty('repositoryUrl')
def appId = requireGradleProperty('appId')
def legacyMsiUpgradeCode = requireGradleProperty('legacyMsiUpgradeCode')
version = installerVersion

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21'
    modules = ['javafx.controls']
}

dependencies {
    implementation project(':localdrop-protocol')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.4'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.4'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.localdrop.LocalDropLauncher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('processResources') {
    inputs.properties([appVersion: installerVersion, appId: appId, repositoryUrl: repositoryUrl])
    filesMatching(['com/localdrop/i18n/messages_*.properties', 'com/localdrop/build-info.properties']) {
        filter { String line -> line
            .replace('@APP_VERSION@', installerVersion)
            .replace('@APP_ID@', appId)
            .replace('@REPOSITORY_URL@', repositoryUrl) }
    }
}

jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Implementation-Version': installerVersion,
            'LocalDrop-App-Id': appId,
            'LocalDrop-Repository-Url': repositoryUrl
        )
    }
}

def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
def installerDescription = 'Local network file transfer'
def installerAssetName = "${technicalName}-Setup-${installerVersion}-x64.exe"
def installerSha256Name = "${installerAssetName}.sha256"

def jpackageInputDir = layout.buildDirectory.dir('jpackage/input')
def jpackageRootDir = layout.buildDirectory.dir('jpackage')
def appImageDir = layout.buildDirectory.dir("jpackage/${technicalName}")
def generatedWindowsIcon = layout.buildDirectory.file("jpackage/${technicalName}.ico")
def innoScript = file('installer/windows/inno/LocalDrop.iss')
def innoOutputDir = layout.buildDirectory.dir('inno')
def innoStagingOutputDir = layout.buildDirectory.dir('inno/staging')
def installerFile = layout.buildDirectory.file("inno/${installerAssetName}")
def appFleetManifestFile = layout.buildDirectory.file('release/appfleet-manifest.json')
def sha256File = layout.buildDirectory.file("release/${installerSha256Name}")
def releaseDirectory = file("dist/release/${installerVersion}")

def resolveJpackageExecutable = {
    def javaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
    def executableName = isWindows ? 'jpackage.exe' : 'jpackage'
    def executable = new File(javaHome, "bin/${executableName}")
    if (!executable.exists()) {
        throw new GradleException("jpackage was not found under ${javaHome}. Use a JDK 21+ installation that includes jpackage.")
    }
    executable.absolutePath
}

def resolveInnoSetupCompiler = {
    List<File> candidates = []
    String explicitCompiler = System.getenv('ISCC_PATH')
    if (explicitCompiler != null && !explicitCompiler.isBlank()) {
        candidates.add(file(explicitCompiler))
    }

    String innoSetupHome = System.getenv('INNO_SETUP_HOME')
    if (innoSetupHome != null && !innoSetupHome.isBlank()) {
        candidates.add(new File(innoSetupHome, 'ISCC.exe'))
    }

    candidates.add(file('C:/Program Files (x86)/Inno Setup 6/ISCC.exe'))
    candidates.add(file('C:/Program Files/Inno Setup 6/ISCC.exe'))

    File compiler = candidates.find { it.isFile() }
    if (compiler == null) {
        throw new GradleException('Inno Setup 6 compiler was not found. Install it with "choco install innosetup -y" or set ISCC_PATH to ISCC.exe.')
    }
    compiler.absolutePath
}

tasks.register('generateWindowsInstallerIcon') {
    description = 'Generates a Windows ICO file for the app image and Inno Setup installer.'
    group = 'distribution'
    inputs.file('src/main/resources/com/localdrop/icons/app.png')
    outputs.file(generatedWindowsIcon)

    doLast {
        File iconFile = generatedWindowsIcon.get().asFile
        iconFile.parentFile.mkdirs()

        File sourceFile = file('src/main/resources/com/localdrop/icons/app.png')
        BufferedImage sourceImage = ImageIO.read(sourceFile)
        if (sourceImage == null) {
            throw new GradleException("Unable to read icon source ${sourceFile}")
        }

        List<Integer> sizes = [16, 32, 48, 64, 128, 256]
        List<byte[]> imagePayloads = sizes.collect { int size ->
            BufferedImage scaled = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
            Graphics2D graphics = scaled.createGraphics()
            graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
            graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
            graphics.drawImage(sourceImage, 0, 0, size, size, null)
            graphics.dispose()

            ByteArrayOutputStream pngBuffer = new ByteArrayOutputStream()
            ImageIO.write(scaled, 'png', pngBuffer)
            pngBuffer.toByteArray()
        }

        iconFile.withOutputStream { output ->
            def writeWord = { int value ->
                output.write(value & 0xFF)
                output.write((value >> 8) & 0xFF)
            }
            def writeDword = { int value ->
                output.write(value & 0xFF)
                output.write((value >> 8) & 0xFF)
                output.write((value >> 16) & 0xFF)
                output.write((value >> 24) & 0xFF)
            }

            writeWord(0)
            writeWord(1)
            writeWord(sizes.size())
            int payloadOffset = 6 + sizes.size() * 16
            sizes.eachWithIndex { int size, int index ->
                output.write(size == 256 ? 0 : size)
                output.write(size == 256 ? 0 : size)
                output.write(0)
                output.write(0)
                writeWord(1)
                writeWord(32)
                writeDword(imagePayloads[index].length)
                writeDword(payloadOffset)
                payloadOffset += imagePayloads[index].length
            }
            imagePayloads.each { byte[] payload -> output.write(payload) }
        }
    }
}

tasks.register('verifyWindowsInstallerIcon') {
    description = 'Verifies that the generated ICO contains every Windows icon layer required by AppFleet.'
    group = 'verification'
    dependsOn 'generateWindowsInstallerIcon'
    inputs.file(generatedWindowsIcon)

    doLast {
        byte[] ico = generatedWindowsIcon.get().asFile.bytes
        if (ico.length < 6 || (ico[0] & 0xFF) != 0 || (ico[1] & 0xFF) != 0
            || (ico[2] & 0xFF) != 1 || (ico[3] & 0xFF) != 0) {
            throw new GradleException('Generated Windows icon is not a valid ICO file.')
        }
        int imageCount = (ico[4] & 0xFF) | ((ico[5] & 0xFF) << 8)
        if (ico.length < 6 + imageCount * 16) {
            throw new GradleException('Generated Windows icon has a truncated directory.')
        }
        Set<Integer> actualSizes = (0..<imageCount).collect { int index ->
            int width = ico[6 + index * 16] & 0xFF
            width == 0 ? 256 : width
        }.toSet()
        Set<Integer> requiredSizes = [16, 32, 48, 64, 128, 256] as Set
        if (actualSizes != requiredSizes) {
            throw new GradleException("Generated Windows icon layers ${actualSizes} do not match ${requiredSizes}.")
        }
    }
}

tasks.register('verifyEmbeddedBuildMetadata') {
    description = 'Verifies version, AppId, and repository URL in the final application JAR.'
    group = 'verification'
    dependsOn tasks.jar

    doLast {
        File applicationJar = tasks.jar.archiveFile.get().asFile
        JarFile jarFile = new JarFile(applicationJar)
        try {
            Map<String, String> expectedManifest = [
                'Implementation-Version': installerVersion,
                'LocalDrop-App-Id': appId,
                'LocalDrop-Repository-Url': repositoryUrl
            ]
            expectedManifest.each { String key, String expectedValue ->
                if (jarFile.manifest.mainAttributes.getValue(key) != expectedValue) {
                    throw new GradleException("Application JAR manifest field ${key} does not match release metadata.")
                }
            }
            def buildInfoEntry = jarFile.getJarEntry('com/localdrop/build-info.properties')
            if (buildInfoEntry == null) {
                throw new GradleException('Application JAR is missing embedded build-info.properties.')
            }
            Properties buildInfo = new Properties()
            jarFile.getInputStream(buildInfoEntry).withCloseable { input -> buildInfo.load(input) }
            if (buildInfo.getProperty('version') != installerVersion
                || buildInfo.getProperty('appId') != appId
                || buildInfo.getProperty('repositoryUrl') != repositoryUrl) {
                throw new GradleException('Embedded build-info.properties does not match release metadata.')
            }
        } finally {
            jarFile.close()
        }
    }
}

tasks.register('prepareJpackageInput', Sync) {
    description = 'Collects application JARs for jpackage.'
    group = 'distribution'
    dependsOn tasks.installDist
    from(layout.buildDirectory.dir("install/${project.name}/lib"))
    into(jpackageInputDir)
}

tasks.register('packageAppImage', Exec) {
    description = 'Builds a self-contained LocalDrop app image with jpackage.'
    group = 'distribution'
    dependsOn 'prepareJpackageInput', 'generateWindowsInstallerIcon', 'verifyWindowsInstallerIcon', 'verifyEmbeddedBuildMetadata'
    inputs.dir(jpackageInputDir)
    inputs.file(generatedWindowsIcon)
    outputs.dir(appImageDir)
    onlyIf { isWindows }

    doFirst {
        delete(appImageDir)
        jpackageRootDir.get().asFile.mkdirs()
    }

    commandLine(
        resolveJpackageExecutable(),
        '--type', 'app-image',
        '--dest', jpackageRootDir.get().asFile.absolutePath,
        '--name', installerAppName,
        '--app-version', installerVersion,
        '--vendor', publisher,
        '--description', installerDescription,
        '--input', jpackageInputDir.get().asFile.absolutePath,
        '--main-jar', "${project.name}-${project.version}.jar",
        '--main-class', application.mainClass.get(),
        '--icon', generatedWindowsIcon.get().asFile.absolutePath
    )
}

tasks.register('verifyAppImageIconResources', Exec) {
    description = 'Verifies that the final LocalDrop app-image EXE embeds native Windows icon resources.'
    group = 'verification'
    dependsOn 'packageAppImage'
    inputs.dir(appImageDir)
    inputs.file('scripts/verify-exe-icon.ps1')
    onlyIf { isWindows }

    doFirst {
        File executable = new File(appImageDir.get().asFile, mainExecutable)
        if (!executable.isFile()) {
            throw new GradleException("Expected app-image executable was not created: ${executable}")
        }
        commandLine(
            'powershell.exe',
            '-NoProfile',
            '-NonInteractive',
            '-ExecutionPolicy', 'Bypass',
            '-File', file('scripts/verify-exe-icon.ps1').absolutePath,
            '-ExecutablePath', executable.absolutePath
        )
    }
}

tasks.register('compileInnoInstaller', Exec) {
    description = 'Builds the LocalDrop per-user Windows installer with Inno Setup.'
    group = 'distribution'
    dependsOn 'verifyAppImageIconResources'
    doNotTrackState('Inno Setup replaces its output EXE atomically; the release compiler must always run.')
    inputs.dir(appImageDir)
    inputs.file(generatedWindowsIcon)
    inputs.file(innoScript)
    inputs.properties([
        appId: appId,
        appName: installerAppName,
        appVersion: installerVersion,
        technicalName: technicalName,
        mainExecutable: mainExecutable,
        publisher: publisher,
        repositoryUrl: repositoryUrl,
        legacyMsiUpgradeCode: legacyMsiUpgradeCode
    ])
    outputs.file(installerFile)
    onlyIf { isWindows }

    doFirst {
        innoOutputDir.get().asFile.mkdirs()
        delete(innoStagingOutputDir)
        innoStagingOutputDir.get().asFile.mkdirs()
        commandLine(
            resolveInnoSetupCompiler(),
            "/DAppVersion=${installerVersion}",
            "/DAppImageDir=${appImageDir.get().asFile.absolutePath}",
            "/DOutputDir=${innoStagingOutputDir.get().asFile.absolutePath}",
            "/DAppId=${appId}",
            "/DAppName=${installerAppName}",
            "/DTechnicalName=${technicalName}",
            "/DMainExecutable=${mainExecutable}",
            "/DPublisher=${publisher}",
            "/DRepositoryUrl=${repositoryUrl}",
            "/DIconFile=${generatedWindowsIcon.get().asFile.absolutePath}",
            "/DLegacyMsiUpgradeCode={${legacyMsiUpgradeCode}}",
            innoScript.absolutePath
        )
    }

    doLast {
        File stagedInstaller = new File(innoStagingOutputDir.get().asFile, installerAssetName)
        if (!stagedInstaller.isFile() || stagedInstaller.length() == 0) {
            throw new GradleException("Inno Setup did not produce the expected staged installer: ${stagedInstaller}")
        }

        File publishedInstaller = installerFile.get().asFile
        java.nio.file.Files.copy(
            stagedInstaller.toPath(),
            publishedInstaller.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

tasks.register('generateAppFleetManifest') {
    description = 'Generates the AppFleet metadata manifest for the Windows installer.'
    group = 'distribution'
    outputs.upToDateWhen { false }
    inputs.properties([
        manifestSchemaContract: 'appfleet-schema-1-desktopicon-2.0.0',
        appId: appId,
        appName: installerAppName,
        appVersion: installerVersion,
        technicalName: technicalName,
        mainExecutable: mainExecutable,
        publisher: publisher,
        repositoryUrl: repositoryUrl,
        installerAssetName: installerAssetName,
        installerSha256Name: installerSha256Name
    ])
    outputs.file(appFleetManifestFile)

    doLast {
        File manifest = appFleetManifestFile.get().asFile
        manifest.parentFile.mkdirs()
        Map content = [
            schemaVersion: 1,
            appId: appId,
            name: installerAppName,
            technicalName: technicalName,
            version: installerVersion,
            repositoryUrl: repositoryUrl,
            platform: 'windows',
            architecture: 'x64',
            installer: [
                type: 'inno',
                assetName: installerAssetName,
                sha256AssetName: installerSha256Name,
                silentArgs: ['/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS'],
                desktopShortcutTask: 'desktopicon'
            ],
            detection: [
                registryKey: "HKCU\\Software\\${publisher}\\${appId}",
                versionValue: 'Version',
                executableValue: 'Executable'
            ],
            processNames: [mainExecutable],
            minimumAppFleetVersion: '2.0.0'
        ]
        manifest.setText(JsonOutput.prettyPrint(JsonOutput.toJson(content)) + System.lineSeparator(), StandardCharsets.UTF_8.name())
    }
}

def installerSha256 = { File source ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    source.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

tasks.register('writeInstallerSha256') {
    description = 'Writes the SHA-256 checksum for the Windows installer.'
    group = 'distribution'
    dependsOn 'compileInnoInstaller'
    outputs.upToDateWhen { false }
    inputs.file(installerFile)
    outputs.file(sha256File)

    doLast {
        File checksum = sha256File.get().asFile
        checksum.parentFile.mkdirs()
        checksum.setText("${installerSha256(installerFile.get().asFile)}  ${installerAssetName}${System.lineSeparator()}", StandardCharsets.UTF_8.name())
    }
}

tasks.register('assembleReleaseArtifacts', Sync) {
    description = 'Places the standard LocalDrop release artifacts in dist/release/<version>.'
    group = 'distribution'
    dependsOn 'compileInnoInstaller', 'generateAppFleetManifest', 'writeInstallerSha256'
    from(installerFile, sha256File, appFleetManifestFile)
    into(releaseDirectory)
}

tasks.register('verifyReleaseVersion') {
    description = 'Ensures a GitHub tag version matches the Gradle application version.'
    group = 'verification'

    doLast {
        String refType = System.getenv('GITHUB_REF_TYPE')
        String refName = System.getenv('GITHUB_REF_NAME')
        if ('tag'.equalsIgnoreCase(refType) && refName != null && !refName.isBlank()) {
            String expectedTag = "v${installerVersion}"
            if (refName != expectedTag) {
                throw new GradleException("GitHub tag ${refName} does not match application version ${installerVersion}; expected ${expectedTag}.")
            }
        }
    }
}

tasks.register('verifyGitHubReleasePublicationPolicy') {
    description = 'Guards the GitHub workflow against overwriting published release assets.'
    group = 'verification'
    File workflow = file('.github/workflows/windows-installer.yml')
    inputs.file(workflow)

    doLast {
        String workflowText = workflow.getText(StandardCharsets.UTF_8.name())
        if (workflowText =~ /(?m)^\s*gh release upload .*--clobber/) {
            throw new GradleException('GitHub release workflow must not overwrite an existing release asset.')
        }
        List<String> requiredGuards = [
            'gh release download $env:TAG_NAME --pattern $asset.Name',
            'Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256',
            'Published artifacts are immutable; create a new version.',
            'gh release edit $env:TAG_NAME --draft=false'
        ]
        requiredGuards.each { String guard ->
            if (!workflowText.contains(guard)) {
                throw new GradleException("GitHub release workflow is missing immutable-release guard: ${guard}")
            }
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    description = 'Validates the installer, checksum, and AppFleet manifest as one release set.'
    group = 'verification'
    dependsOn 'assembleReleaseArtifacts', 'verifyEmbeddedBuildMetadata', 'verifyWindowsInstallerIcon', 'verifyGitHubReleasePublicationPolicy'

    doLast {
        Set<String> expectedFiles = [installerAssetName, installerSha256Name, 'appfleet-manifest.json'] as Set
        Set<String> actualFiles = releaseDirectory.listFiles()?.findAll { it.isFile() }?.collect { it.name }?.toSet() ?: [] as Set
        if (actualFiles != expectedFiles) {
            throw new GradleException("Unexpected release artifact set in ${releaseDirectory}: ${actualFiles}")
        }

        Map expectedManifest = [
            schemaVersion: 1,
            appId: appId,
            name: installerAppName,
            technicalName: technicalName,
            version: installerVersion,
            repositoryUrl: repositoryUrl,
            platform: 'windows',
            architecture: 'x64',
            installer: [
                type: 'inno',
                assetName: installerAssetName,
                sha256AssetName: installerSha256Name,
                silentArgs: ['/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS'],
                desktopShortcutTask: 'desktopicon'
            ],
            detection: [
                registryKey: "HKCU\\Software\\${publisher}\\${appId}",
                versionValue: 'Version',
                executableValue: 'Executable'
            ],
            processNames: [mainExecutable],
            minimumAppFleetVersion: '2.0.0'
        ]
        Map manifestData = new JsonSlurper().parse(new File(releaseDirectory, 'appfleet-manifest.json')) as Map
        if (manifestData != expectedManifest) {
            throw new GradleException('AppFleet manifest does not exactly match the validated release metadata contract.')
        }

        File installer = new File(releaseDirectory, installerAssetName)
        if (!installer.isFile() || installer.length() == 0) {
            throw new GradleException('Windows installer artifact is missing or empty.')
        }
        String actualHash = installerSha256(installer)
        String expectedChecksumLine = "${actualHash}  ${installerAssetName}"
        String checksumText = new File(releaseDirectory, installerSha256Name).getText(StandardCharsets.UTF_8.name())
        if (checksumText.trim() != expectedChecksumLine) {
            throw new GradleException('Installer SHA-256 file does not match the generated installer.')
        }
    }
}

tasks.register('buildWindowsInstaller') {
    description = 'Builds and verifies the standard LocalDrop Windows release artifact set.'
    group = 'distribution'
    dependsOn 'test', 'verifyReleaseVersion', 'verifyReleaseArtifacts'
}

tasks.register('packageInstaller') {
    description = 'Compatibility alias for buildWindowsInstaller.'
    group = 'distribution'
    dependsOn 'buildWindowsInstaller'
}
